name: exp05 quake forward weekly

on:
  schedule:
    # 月曜 14:00 JST = 05:00 UTC。前週（月〜日）の余震件数を採点する
    - cron: "0 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch quakes (cumulative archive)
        working-directory: exp05_quake
        run: python3 fetch.py
      - name: Score forward ledger
        working-directory: exp05_quake
        run: python3 forward.py
      - name: Build dashboard
        run: python3 build_site.py
      - name: Commit archive and report
        run: |
          git config user.name "forward-bot"
          git config user.email "actions@users.noreply.github.com"
          git add exp05_quake/archive exp05_quake/reports docs
          git diff --cached --quiet && echo "no changes" || git commit -m "quake forward: $(date -u +%Y-%m-%d) weekly"
          git push
      - name: Record failure (落ちたことを台帳に残す)
        if: failure()
        run: |
          git config user.name "incident-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          mkdir -p docs
          echo "| $(date -u +%Y-%m-%dT%H:%MZ) | ${{ github.workflow }} | [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) | 未対応 |" >> docs/incidents.md
          git add docs/incidents.md
          git commit -m "incident: ${{ github.workflow }} が失敗" || true
          git push || true
