name: exp02 veg forward weekly

on:
  schedule:
    # 水曜 14:00 JST = 05:00 UTC。ベジ探の2〜3日遅れを見込んで前週分を採点する
    - cron: "0 5 * * 3"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch market data
        working-directory: exp02_vegetable
        run: python3 fetch.py
      - name: Score forward ledger
        working-directory: exp02_vegetable
        run: python3 forward.py
      - name: Build dashboard
        run: python3 build_site.py
      - name: Commit report
        run: |
          git config user.name "forward-bot"
          git config user.email "actions@users.noreply.github.com"
          git add exp02_vegetable/reports docs
          git diff --cached --quiet && echo "no changes" || git commit -m "veg forward: $(date -u +%Y-%m-%d) weekly"
          pushed=0
          for i in 1 2 3 4 5; do
            if git push; then pushed=1; break; fi
            echo "push競合。リモートを取り込んで再試行 ($i/5)"
            git pull --rebase --autostash origin main || true
            sleep $((i * 3))
          done
          [ "$pushed" = "1" ]
      - name: Record failure (落ちたことを台帳に残す)
        if: failure()
        run: |
          git config user.name "incident-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          mkdir -p docs
          echo "| $(date -u +%Y-%m-%dT%H:%MZ) | ${{ github.workflow }} | [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) | 未対応 |" >> docs/incidents.md
          git add docs/incidents.md
          git commit -m "incident: ${{ github.workflow }} が失敗" || true
          git push || true
