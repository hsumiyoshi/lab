name: uptime meter

on:
  schedule:
    - cron: "0 3 * * 3"   # 水曜12:00 JST（週次レビュー前に更新）
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

jobs:
  uptime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Measure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 uptime.py
      - name: Commit
        run: |
          git config user.name "uptime-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/uptime.md
          git diff --cached --quiet && echo "no changes" || git commit -m "uptime: $(date -u +%Y-%m-%d) 無停止率を更新"
          git push
