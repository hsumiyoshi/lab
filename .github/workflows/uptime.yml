name: uptime meter

on:
  # 2026-11-03 定時実行を止めた（本社の中間ゲートで「やめる」に仕分け）。再開するときは git 履歴から schedule を戻す
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

jobs:
  uptime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Measure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 uptime.py
      - name: Commit
        run: |
          git config user.name "uptime-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/uptime.md
          git diff --cached --quiet && echo "no changes" || git commit -m "uptime: $(date -u +%Y-%m-%d) 無停止率を更新"
          bash scripts/push_with_retry.sh
