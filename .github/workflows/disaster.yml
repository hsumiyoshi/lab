name: exp10 global disaster league

on:
  schedule:
    - cron: "0 22 * * *"   # 07:00 JST: RSS取込 → 翌日分の提出 → 確定日の採点
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  disaster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect + submit + score
        working-directory: exp10_disaster
        run: python3 disaster.py
      - name: Commit
        run: |
          git config user.name "disaster-bot"
          git config user.email "actions@users.noreply.github.com"
          git add exp10_disaster/picks exp10_disaster/data exp10_disaster/reports
          git diff --cached --quiet && echo "no changes" || git commit -m "disaster: $(date -u +%Y-%m-%d) 取込・提出・採点"
          git push
