name: exp10 global disaster league

on:
  schedule:
    - cron: "0 22 * * *"   # 07:00 JST: RSS取込 → 翌日分の提出 → 確定日の採点
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  disaster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect + submit + score (GDACS)
        working-directory: exp10_disaster
        run: python3 disaster.py
      - name: Ingest FIRMS (鍵が設定されていれば)
        working-directory: exp10_disaster
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        continue-on-error: true
        run: python3 firms.py
      - name: Build dashboard（台帳を更新したら必ず作り直す）
        run: python3 build_site.py
      - name: Commit
        run: |
          git config user.name "disaster-bot"
          git config user.email "actions@users.noreply.github.com"
          git add exp10_disaster/picks exp10_disaster/data exp10_disaster/reports docs
          git diff --cached --quiet && echo "no changes" || git commit -m "disaster: $(date -u +%Y-%m-%d) 取込・提出・採点"
          bash scripts/push_with_retry.sh
      - name: Record failure (落ちたことを台帳に残す)
        if: failure()
        run: |
          git config user.name "incident-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          mkdir -p docs
          echo "| $(date -u +%Y-%m-%dT%H:%MZ) | ${{ github.workflow }} | [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) | 未対応 |" >> docs/incidents.md
          git add docs/incidents.md
          git commit -m "incident: ${{ github.workflow }} が失敗" || true
          git push || true
