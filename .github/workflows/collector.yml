name: collector

# 収集の共通ランタイム（宣言＋パーサ）で動くソース群。
# 個別のリーグCIと違い、**新しいソースはsources.pyに30行足すだけ**でここに乗る。
on:
  schedule:
    - cron: "0 22 * * *"    # 07:00 JST
    - cron: "10 8 * * *"    # 17:10 JST（九電の発表後）
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        working-directory: collector
        run: python3 collect.py
      - name: Commit
        if: always()
        run: |
          git config user.name "collector-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          git add collector/data collector/raw docs/incidents.md
          git diff --cached --quiet && echo "no changes" || git commit -m "collect: $(date -u +%Y-%m-%dT%H)Z"
          bash scripts/push_with_retry.sh
