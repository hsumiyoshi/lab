name: smoke test

# 壊れたコードが本番スケジュールに乗る前に落とす。外部APIは叩かない（コミット済みデータのみ）。
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 smoke_test.py
