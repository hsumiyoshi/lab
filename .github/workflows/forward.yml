name: exp01 forward daily

on:
  # 2026-11-03 定時実行を止めた（本社の中間ゲートで「やめる」に仕分け）。再開するときは git 履歴から schedule を戻す
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run forward runner
        working-directory: exp01_jepx
        run: python3 forward.py
      - name: Build dashboard（台帳を更新したら必ず作り直す）
        run: python3 build_site.py
      - name: Commit report
        run: |
          git config user.name "forward-bot"
          git config user.email "actions@users.noreply.github.com"
          # spotも積む。**追跡対象なのにaddしていなかった**ため、リポジトリの価格が
          # 台帳より古いままになり「誰でも再現できる」がリポジトリ単体では成り立って
          # いなかった（2026-08-29の敵対的レビュー指摘）。追記型なので差分は小さい
          git add exp01_jepx/reports exp01_jepx/data/weather_actual.csv exp01_jepx/data/weather_forecast.csv exp01_jepx/data/spot_*.csv docs
          git diff --cached --quiet && echo "no changes" || git commit -m "forward: $(date -u +%Y-%m-%d) daily report（気象CSVの差分含む）"
          bash scripts/push_with_retry.sh
      - name: Record failure (落ちたことを台帳に残す)
        if: failure()
        run: |
          git config user.name "incident-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          mkdir -p docs
          echo "| $(date -u +%Y-%m-%dT%H:%MZ) | ${{ github.workflow }} | [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) | 未対応 |" >> docs/incidents.md
          git add docs/incidents.md
          git commit -m "incident: ${{ github.workflow }} が失敗" || true
          git push || true
