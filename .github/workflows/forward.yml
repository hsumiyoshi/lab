name: exp01 forward daily

on:
  schedule:
    # 13:30 JST = 04:30 UTC。JEPXの翌日価格公表(〜12:30 JST)後に実行。
    # picksは「まだ入札が締まっていない翌々日受渡分」を自動選択する
    - cron: "30 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run forward runner
        working-directory: exp01_jepx
        run: python3 forward.py
      - name: Commit report
        run: |
          git config user.name "forward-bot"
          git config user.email "actions@users.noreply.github.com"
          git add exp01_jepx/reports exp01_jepx/data/weather_actual.csv exp01_jepx/data/weather_forecast.csv
          git diff --cached --quiet && echo "no changes" || git commit -m "forward: $(date -u +%Y-%m-%d) daily report（気象CSVの差分含む）"
          pushed=0
          for i in 1 2 3 4 5; do
            if git push; then pushed=1; break; fi
            echo "push競合。リモートを取り込んで再試行 ($i/5)"
            git pull --rebase --autostash origin main || true
            sleep $((i * 3))
          done
          [ "$pushed" = "1" ]
      - name: Record failure (落ちたことを台帳に残す)
        if: failure()
        run: |
          git config user.name "incident-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          mkdir -p docs
          echo "| $(date -u +%Y-%m-%dT%H:%MZ) | ${{ github.workflow }} | [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) | 未対応 |" >> docs/incidents.md
          git add docs/incidents.md
          git commit -m "incident: ${{ github.workflow }} が失敗" || true
          git push || true
