name: exp03 weather league

on:
  schedule:
    # 18:00 JST = 09:00 UTC。気象庁の17:00発表を見た後に翌日分を提出し、同時に過去分を採点
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Submit + score
        working-directory: exp03_weather
        run: python3 forecast.py
      - name: Commit
        run: |
          git config user.name "weather-bot"
          git config user.email "actions@users.noreply.github.com"
          git add exp03_weather/picks exp03_weather/data exp03_weather/reports
          git diff --cached --quiet && echo "no changes" || git commit -m "weather: $(date -u +%Y-%m-%d) 提出と採点"
          pushed=0
          for i in 1 2 3 4 5; do
            if git push; then pushed=1; break; fi
            echo "push競合。リモートを取り込んで再試行 ($i/5)"
            git pull --rebase --autostash origin main || true
            sleep $((i * 3))
          done
          [ "$pushed" = "1" ]
      - name: Record failure (落ちたことを台帳に残す)
        if: failure()
        run: |
          git config user.name "incident-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          mkdir -p docs
          echo "| $(date -u +%Y-%m-%dT%H:%MZ) | ${{ github.workflow }} | [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) | 未対応 |" >> docs/incidents.md
          git add docs/incidents.md
          git commit -m "incident: ${{ github.workflow }} が失敗" || true
          git push || true
