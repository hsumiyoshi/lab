name: exp11 books ranking league

on:
  schedule:
    - cron: "0 22 * * 3"   # 木曜07:00 JST（トーハンの週次公表後に取得・採点・提出）
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  books:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch + score + submit
        working-directory: exp11_books
        run: python3 books.py
      - name: Build dashboard（台帳を更新したら必ず作り直す）
        run: python3 build_site.py
      - name: Commit
        run: |
          git config user.name "books-bot"
          git config user.email "actions@users.noreply.github.com"
          git add exp11_books/picks exp11_books/data exp11_books/reports docs
          git diff --cached --quiet && echo "no changes" || git commit -m "books: $(date -u +%Y-%m-%d) 取得・採点・提出"
          pushed=0
          for i in 1 2 3 4 5; do
            if git push; then pushed=1; break; fi
            echo "push競合。リモートを取り込んで再試行 ($i/5)"
            git pull --rebase --autostash origin main || true
            sleep $((i * 3))
          done
          [ "$pushed" = "1" ]
      - name: Record failure (落ちたことを台帳に残す)
        if: failure()
        run: |
          git config user.name "incident-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          mkdir -p docs
          echo "| $(date -u +%Y-%m-%dT%H:%MZ) | ${{ github.workflow }} | [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) | 未対応 |" >> docs/incidents.md
          git add docs/incidents.md
          git commit -m "incident: ${{ github.workflow }} が失敗" || true
          git push || true
