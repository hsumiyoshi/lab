<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ルール図解SVG（4リーグ）</title>
<!--
  後工程用: <SVG:名前> 開始/終了コメントマーカーの間が切り出し対象の断片。
  断片は<svg>単体・外部参照なし・width:100%可変。色はすべて var(--token, ライト時fallback) で
  site_template.html のトークン（--ink --ink2 --muted --line --card --accent）を継承する。
  機体色・売買色は固定hex（買=#2a78d6 / 売=#eb6834 / 生育=#1baf7a）。
  切り出し例: re.search(r"<!ダッシュ2つSVG:veg(ダッシュ2つ)>(.*?)<!ダッシュ2つ/SVG:veg\1>", t, re.S)
-->
<style>
:root{color-scheme:light dark;
  --bg:#f6f5f1;--card:#fcfcfb;--ink:#1a1915;--ink2:#52514e;--muted:#898781;--line:#e1e0d9;--accent:#2a78d6}
@media (prefers-color-scheme:dark){:root{
  --bg:#131311;--card:#1d1c19;--ink:#f0efe9;--ink2:#b5b3ac;--muted:#7a786f;--line:#33322d;--accent:#6ea8e8}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;
  padding:32px 18px}
.wrap{max-width:720px;margin:0 auto}
h2{font-size:.95rem;margin:26px 0 8px;color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
</style>
</head>
<body>
<div class="wrap">
<h1 style="font-size:1.2rem">ルール図解（プレビュー）</h1>

<h2>🥬 veg — 青果: どの日に売る？</h2>
<div class="card">
<!--SVG:veg-->
<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="ルール図: 1週間の日別価格のうち、どの日に売るかを競う。oracleは後知恵の最高値の日、均等出荷は毎日6分の1ずつ売る"
     style="display:block;width:100%;height:auto">
  <text x="16" y="22" font-size="12" fill="var(--ink2,#52514e)">1週間の日別価格（東京市場）</text>
  <rect x="16" y="32" width="10" height="10" rx="2" fill="#2a78d6" opacity=".45"/>
  <text x="32" y="41" font-size="12" fill="var(--ink2,#52514e)">均等出荷＝毎日1/6ずつ売る</text>
  <text x="330" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="var(--ink,#1a1915)">どの日に売る？</text>

  <!-- 日別価格バー（角丸は上端のみ） -->
  <g fill="var(--muted,#898781)" opacity=".32">
    <path d="M68,170 V110 q0,-4 4,-4 h36 q4,0 4,4 V170 Z"/>
    <path d="M153,170 V86 q0,-4 4,-4 h36 q4,0 4,4 V170 Z"/>
    <path d="M238,170 V98 q0,-4 4,-4 h36 q4,0 4,4 V170 Z"/>
    <path d="M408,170 V118 q0,-4 4,-4 h36 q4,0 4,4 V170 Z"/>
    <path d="M493,170 V132 q0,-4 4,-4 h36 q4,0 4,4 V170 Z"/>
  </g>
  <!-- 木曜＝最高値（oracleが売る日） -->
  <path d="M323,170 V64 q0,-4 4,-4 h36 q4,0 4,4 V170 Z" fill="#eb6834" opacity=".28"/>

  <!-- 均等出荷スラブ（全日の根元に少しずつ） -->
  <g fill="#2a78d6" opacity=".45">
    <rect x="68" y="157" width="44" height="13"/>
    <rect x="153" y="157" width="44" height="13"/>
    <rect x="238" y="157" width="44" height="13"/>
    <rect x="323" y="157" width="44" height="13"/>
    <rect x="408" y="157" width="44" height="13"/>
    <rect x="493" y="157" width="44" height="13"/>
  </g>

  <!-- 売マーク（最高値の日） -->
  <path d="M338,56 l7,-11 7,11 z" fill="#eb6834"/>
  <text x="358" y="54" font-size="14" font-weight="600" fill="var(--ink,#1a1915)">売（oracle＝後知恵の最高値）</text>

  <!-- 軸・曜日 -->
  <path d="M52,170 H552" stroke="var(--line,#e1e0d9)" stroke-width="1"/>
  <g font-size="12" fill="var(--muted,#898781)" text-anchor="middle">
    <text x="90" y="189">月</text><text x="175" y="189">火</text><text x="260" y="189">水</text>
    <text x="345" y="189">木</text><text x="430" y="189">金</text><text x="515" y="189">土</text>
  </g>
</svg>
<!--/SVG:veg-->
</div>

<h2>🌏 quake — 地震: 来週の余震は何件？</h2>
<div class="card">
<!--SVG:quake-->
<svg viewBox="0 0 600 196" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="ルール図: 本震後の日別余震件数が大森則で減衰していく。右端の来週ゾーンの件数を予測カーブの外挿で当てる"
     style="display:block;width:100%;height:auto">
  <text x="16" y="22" font-size="12" fill="var(--ink2,#52514e)">日別の余震件数</text>

  <!-- 観測バー（本震から減衰） -->
  <g fill="var(--muted,#898781)" opacity=".32">
    <path d="M48,160 V44 q0,-4 4,-4 h16 q4,0 4,4 V160 Z"/>
    <path d="M78,160 V104 q0,-4 4,-4 h16 q4,0 4,4 V160 Z"/>
    <path d="M108,160 V124 q0,-4 4,-4 h16 q4,0 4,4 V160 Z"/>
    <path d="M138,160 V134 q0,-4 4,-4 h16 q4,0 4,4 V160 Z"/>
    <path d="M168,160 V140 q0,-4 4,-4 h16 q4,0 4,4 V160 Z"/>
    <path d="M198,160 V144 q0,-4 4,-4 h16 q4,0 4,4 V160 Z"/>
    <path d="M228,160 V147 q0,-4 4,-4 h16 q4,0 4,4 V160 Z"/>
    <path d="M258,160 V149 q0,-4 4,-4 h16 q4,0 4,4 V160 Z"/>
    <path d="M288,160 V151 q0,-4 4,-4 h16 q4,0 4,4 V160 Z"/>
    <path d="M318,160 V152 q0,-3 3,-3 h18 q3,0 3,3 V160 Z"/>
    <path d="M348,160 V153 q0,-3 3,-3 h18 q3,0 3,3 V160 Z"/>
    <path d="M378,160 V154 q0,-3 3,-3 h18 q3,0 3,3 V160 Z"/>
    <path d="M408,160 V154.5 q0,-2.5 2.5,-2.5 h19 q2.5,0 2.5,2.5 V160 Z"/>
    <path d="M438,160 V155 q0,-2.5 2.5,-2.5 h19 q2.5,0 2.5,2.5 V160 Z"/>
  </g>

  <!-- 大森則カーブ（観測区間は実線） -->
  <path d="M60,40 C70,70 80,90 90,100 C100,110 110,116 120,120 C135,126 152,130 180,136
           C210,140 260,144 320,147 C370,149 420,150.6 462,151.6"
        stroke="var(--accent,#2a78d6)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="168" y="114" font-size="14" font-weight="600" fill="var(--ink,#1a1915)">大森則の減衰カーブ</text>

  <!-- 来週ゾーン（点線枠）＋外挿 -->
  <rect x="478" y="40" width="106" height="120" rx="8" fill="none"
        stroke="var(--muted,#898781)" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="531" y="32" text-anchor="middle" font-size="14" font-weight="600" fill="var(--ink,#1a1915)">来週</text>
  <path d="M462,151.6 C500,152.5 540,153.3 576,154"
        stroke="var(--accent,#2a78d6)" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="2 5"/>
  <text x="531" y="106" text-anchor="middle" font-size="22" font-weight="700" fill="var(--muted,#898781)">？</text>

  <!-- 軸 -->
  <path d="M40,160 H584" stroke="var(--line,#e1e0d9)" stroke-width="1"/>
  <text x="60" y="180" text-anchor="middle" font-size="12" fill="var(--muted,#898781)">本震</text>
  <text x="258" y="180" text-anchor="middle" font-size="12" fill="var(--muted,#898781)">経過日数 →</text>
  <text x="531" y="180" text-anchor="middle" font-size="12" fill="var(--muted,#898781)">週次で件数を予測</text>
</svg>
<!--/SVG:quake-->
</div>

<h2>🏠 re — 不動産: 予言が先、データが後</h2>
<div class="card">
<!--SVG:re-->
<svg viewBox="0 0 600 158" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="ルール図: 2026年7月28日の地震のあと、8月13日に予言をgitコミットし、2027年のデータ公表を待って判定する。予言が先、データが後"
     style="display:block;width:100%;height:auto">
  <!-- 主役メッセージ: コミット→公表 の順序 -->
  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink,#1a1915)">予言が先、データが後</text>
  <path d="M240,42 H372" stroke="var(--accent,#2a78d6)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M372,38 l8,4 -8,4" stroke="var(--accent,#2a78d6)" stroke-width="1.6" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M230,48 V70 M390,48 V70" stroke="var(--muted,#898781)" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- タイムライン -->
  <path d="M36,90 H556" stroke="var(--muted,#898781)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M556,86 l8,4 -8,4" stroke="var(--muted,#898781)" stroke-width="1.5" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 1) 地震（震動波形） -->
  <circle cx="70" cy="90" r="16" fill="var(--card,#fcfcfb)" stroke="var(--line,#e1e0d9)" stroke-width="1.5"/>
  <path d="M62,90 l2.5,-5 3,9 3,-8 3,6 2.5,-2" stroke="var(--ink,#1a1915)" stroke-width="1.7"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 2) 予言をコミット（錠前・ここだけ強調） -->
  <circle cx="230" cy="90" r="16" fill="var(--card,#fcfcfb)" stroke="var(--accent,#2a78d6)" stroke-width="1.8"/>
  <g transform="translate(230,90) scale(.8)" stroke="var(--ink,#1a1915)" stroke-width="1.8"
     fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-5.5,-3 v-2.5 a5.5,5.5 0 0 1 11,0 V-3"/>
    <rect x="-8" y="-3" width="16" height="12" rx="2.5"/>
    <circle cx="0" cy="3" r="1.6" fill="var(--ink,#1a1915)" stroke="none"/>
  </g>
  <!-- 3) データ公表（書類） -->
  <circle cx="390" cy="90" r="16" fill="var(--card,#fcfcfb)" stroke="var(--line,#e1e0d9)" stroke-width="1.5"/>
  <g transform="translate(390,90)" stroke="var(--ink,#1a1915)" stroke-width="1.6"
     fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-6,-8 h8 l4,4 v12 h-12 z M2,-8 v4 h4"/>
    <path d="M-3,1 h6 M-3,4.5 h6"/>
  </g>
  <!-- 4) 判定（天秤） -->
  <circle cx="530" cy="90" r="16" fill="var(--card,#fcfcfb)" stroke="var(--line,#e1e0d9)" stroke-width="1.5"/>
  <g transform="translate(530,90) scale(.8)" stroke="var(--ink,#1a1915)" stroke-width="1.8"
     fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0,-8 V8 M-5,8 H5 M-8,-5 H8"/>
    <path d="M-8,-5 l-3,6 M-8,-5 l3,6 M-11,1 a3,3 0 0 0 6,0"/>
    <path d="M8,-5 l-3,6 M8,-5 l3,6 M5,1 a3,3 0 0 0 6,0"/>
  </g>

  <!-- ラベル -->
  <g text-anchor="middle">
    <text x="70" y="124" font-size="14" font-weight="600" fill="var(--ink,#1a1915)">地震 M7.1</text>
    <text x="70" y="142" font-size="12" fill="var(--muted,#898781)">2026-07-28</text>
    <text x="230" y="124" font-size="14" font-weight="600" fill="var(--ink,#1a1915)">予言をコミット</text>
    <text x="230" y="142" font-size="12" fill="var(--muted,#898781)">2026-08-13</text>
    <text x="390" y="124" font-size="14" font-weight="600" fill="var(--ink,#1a1915)">データ公表</text>
    <text x="390" y="142" font-size="12" fill="var(--muted,#898781)">2027年</text>
    <text x="530" y="124" font-size="14" font-weight="600" fill="var(--ink,#1a1915)">判定</text>
    <text x="530" y="142" font-size="12" fill="var(--muted,#898781)">2027-01〜</text>
  </g>
</svg>
<!--/SVG:re-->
</div>

<h2>🛰 sat — 衛星: NDVI 0.65 到達日 → 出荷週</h2>
<div class="card">
<!--SVG:sat-->
<svg viewBox="0 0 600 196" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="ルール図: 春から夏にかけてNDVIが上昇し0.75で飽和する。0.65の閾値線を越えた到達日から、右の出荷週を予測する"
     style="display:block;width:100%;height:auto">
  <text x="16" y="22" font-size="12" fill="var(--ink2,#52514e)">キャベツ畑のNDVI（衛星の植生指数）</text>

  <!-- 出荷週バンド -->
  <rect x="500" y="40" width="60" height="128" fill="#1baf7a" opacity=".18"/>
  <text x="530" y="32" text-anchor="middle" font-size="14" font-weight="600" fill="var(--ink,#1a1915)">出荷週</text>

  <!-- 閾値 0.65 -->
  <path d="M40,82 H480" stroke="var(--muted,#898781)" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="44" y="74" font-size="12" fill="var(--muted,#898781)">NDVI 0.65</text>

  <!-- 生育カーブ（0.4 → 0.75で飽和） -->
  <path d="M50,150 C110,148 150,142 190,128 C230,114 270,96 310,82 C350,68 390,58 420,56 C440,54.5 460,54 480,54"
        stroke="#1baf7a" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- 到達日（交点）と出荷週への矢印 -->
  <path d="M310,88 V168" stroke="var(--muted,#898781)" stroke-width="1" stroke-dasharray="2 4"/>
  <circle cx="310" cy="82" r="6" fill="var(--accent,#2a78d6)" stroke="var(--card,#fcfcfb)" stroke-width="2"/>
  <text x="300" y="64" text-anchor="end" font-size="14" font-weight="600" fill="var(--ink,#1a1915)">到達日</text>
  <path d="M320,72 C380,44 440,38 490,40" stroke="var(--accent,#2a78d6)" stroke-width="1.8"
        fill="none" stroke-linecap="round"/>
  <path d="M483,35 l8,5 -9,3" stroke="var(--accent,#2a78d6)" stroke-width="1.8" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 軸 -->
  <path d="M40,168 H560" stroke="var(--line,#e1e0d9)" stroke-width="1"/>
  <text x="60" y="188" text-anchor="middle" font-size="12" fill="var(--muted,#898781)">春</text>
  <text x="310" y="188" text-anchor="middle" font-size="12" fill="var(--muted,#898781)">この日を当てる</text>
  <text x="460" y="188" text-anchor="middle" font-size="12" fill="var(--muted,#898781)">夏</text>
</svg>
<!--/SVG:sat-->
</div>

</div>
</body>
</html>
